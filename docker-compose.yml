services:
  backend:
    build: .
    ports:
      - "8080:8080"
    devices:
      - /dev/hailo0:/dev/hailo0
    volumes:
      - ./baro.db:/app/baro.db
    environment:
      - BACKEND_HOST=0.0.0.0
      - BACKEND_PORT=8080
      - YOLO_MODEL_PATH=models/yolo11n-pose_hailo_model
    restart: unless-stopped
